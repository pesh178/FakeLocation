name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of versionName to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# Serialise releases: the job commits the version bump and publishes a tag.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Tags are needed to reject an existing tag and to generate notes.
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36"

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE:-branch}" != "branch" ]; then
            echo "::error::Dispatch this workflow on a branch; it commits the version bump back"
            exit 1
          fi

          current_code=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]\+\([0-9]\{1,\}\).*/\1/p' app/build.gradle | head -n 1)
          current_name=$(sed -n 's/^[[:space:]]*versionName[[:space:]]\+"\([0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}\)".*/\1/p' app/build.gradle | head -n 1)
          if [ -z "$current_code" ] || [ -z "$current_name" ]; then
            echo "::error::Cannot read versionCode/versionName from app/build.gradle"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current_name"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::Unsupported bump input: $BUMP"; exit 1 ;;
          esac
          new_code=$((current_code + 1))
          new_name="$major.$minor.$patch"

          if git tag --list "v$new_name" | grep -q .; then
            echo "::error::Tag v$new_name already exists"
            exit 1
          fi

          sed -i "s/^\([[:space:]]*versionCode[[:space:]]\+\)$current_code\([[:space:]]*\)$/\1$new_code\2/" app/build.gradle
          sed -i "s/^\([[:space:]]*versionName[[:space:]]\+\)\"$current_name\"\(.*\)$/\1\"$new_name\"\2/" app/build.gradle
          grep -q "^[[:space:]]*versionCode[[:space:]]\+$new_code$" app/build.gradle
          grep -q "^[[:space:]]*versionName[[:space:]]\+\"$new_name\"$" app/build.gradle

          {
            echo "name=$new_name"
            echo "code=$new_code"
            echo "apk=FakeLocation_v$new_name.apk"
          } >> "$GITHUB_OUTPUT"
          echo "Bumped $current_name ($current_code) -> $new_name ($new_code)"

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Verify APK signature
        env:
          APK: app/build/outputs/apk/release/${{ steps.version.outputs.apk }}
        run: |
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Commit version bump
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release version $VERSION_NAME"
          git tag "v$VERSION_NAME"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v$VERSION_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.name }}
          APK: app/build/outputs/apk/release/${{ steps.version.outputs.apk }}
        run: |
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
