apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

ext.compose_version = '1.6.8'

def releaseSigningStoreFile = System.getenv('SIGNING_STORE_FILE')
def releaseSigningConfigured = releaseSigningStoreFile != null && !releaseSigningStoreFile.isEmpty()

static def releaseAppName() {
    return "FakeLocation"
}

android {
    namespace 'com.xposed.hook'
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.xposed.hook"
        minSdkVersion 26
        targetSdkVersion 29
        versionCode 23
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseSigningStoreFile)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            applicationVariants.all {
                variant ->
                    variant.outputs.each {
                        output -> output.outputFileName = "${releaseAppName()}_v${defaultConfig.versionName}.apk"
                    }
            }
        }
    }
    lint {
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'

    implementation "androidx.compose.ui:ui:$compose_version"
    // Tooling support (Previews, etc.)
    implementation "androidx.compose.ui:ui-tooling:$compose_version"
    // Foundation (Border, Background, Box, Image, Scroll, shapes, animations, etc.)
    implementation "androidx.compose.foundation:foundation:$compose_version"
    // Material Design
    implementation "androidx.compose.material:material:$compose_version"
    // Material design icons
    implementation "androidx.compose.material:material-icons-core:$compose_version"
    // Integration with activities
    implementation 'androidx.activity:activity-compose:1.9.0'
    // Integration with ViewModels
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0'
    // Integration with observables
    implementation "androidx.compose.runtime:runtime-livedata:$compose_version"

    compileOnly 'io.github.libxposed:api:102.0.0'
    // 框架侧远程配置通道（LSPosed 数据库），替代模块自己的 ContentProvider。
    implementation 'io.github.libxposed:service:101.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.github.libxposed:api:102.0.0'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}
